name: Bundle and Deploy

on:
  push:
    branches:
      - "[0-9]+.[0-9]+/*"
  workflow_dispatch:

permissions:
  contents: write

# Every branch's deploy pushes to the same gh-pages branch, so runs must serialize
# across the whole repo: concurrent deploys race and the loser's push is rejected
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bundle-deploy:
    name: Bundle and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v6
      - name: Setup Node.js Environment
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      # The bundler stamps the registry's display name from package.json, so without
      # this every branch's repo shows up in the app with the identical name
      - name: Label non-stable registry
        if: github.ref_name != '0.9/stable'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name += ` — ${process.env.BRANCH.split("/").pop()}`;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
      - name: Bundle Extensions
        run: npm run bundle
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: bundles
          destination_dir: ${{ github.ref_name }}
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
